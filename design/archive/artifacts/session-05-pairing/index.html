<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DSH · 05 明暗搭配</title>
  <link rel="stylesheet" href="../session-material-wall/signal.css"><link rel="stylesheet" href="../session-material-wall/native.css">
  <link rel="stylesheet" href="../session-material-wall/fivebeat.css"><link rel="stylesheet" href="../session-material-wall/dia-layout.css">
  <link rel="stylesheet" href="../session-material-wall/surfaces.css"><link rel="stylesheet" href="../session-material-wall/explorations.css">
  <link rel="stylesheet" href="refinement.css?v=1"><link rel="stylesheet" href="pairing.css?v=1">
  <link rel="stylesheet" href="dia-calibration.css?v=1"><script src="dia-calibration.js?v=1"></script>
</head>
<body>
  <header class="page-header"><div><h1>05 · 明暗搭配</h1><p>亮色保留 05，暗色调成轻轻浮起。</p></div><a href="../session-material-wall/index.html?material=05&theme=dark&view=liked">返回喜欢的方向 ↗</a></header>
  <main>
    <section class="pair-section" aria-labelledby="light-title">
      <div class="section-heading"><h2 id="light-title">亮色 <span>05 · 保持原样</span></h2><a id="light-trial" href="preview.html?mode=raised&theme=light">完整试用 ↗</a></div>
      <div class="pair-stage" data-theme="light"><div id="light-surface" class="signal-overlay material-surface pair-surface" data-material-id="05"><div class="signal-panel"><ul class="signal-list" tabindex="0" role="listbox" aria-label="05 亮色的会话预览"></ul></div></div></div>
    </section>
    <section class="pair-section" aria-labelledby="dark-title">
      <div class="section-heading dark-heading"><h2 id="dark-title">暗色 <span id="dark-name">05 · 轻浮</span></h2><nav class="mode-picker" aria-label="暗色方案"><button type="button" data-mode="original" aria-pressed="false">05 原版</button><button type="button" data-mode="raised" aria-pressed="true">05 轻浮</button><button type="button" data-mode="reference" aria-pressed="false">07 参考</button></nav><a id="dark-trial" href="preview.html?mode=raised&theme=dark">完整试用 ↗</a></div>
      <div class="pair-stage" data-theme="dark"><div id="dark-surface" class="signal-overlay material-surface pair-surface" data-material-id="05" data-refinement="raised"><div class="signal-panel"><ul class="signal-list" tabindex="0" role="listbox" aria-label="暗色的会话预览"></ul></div></div></div>
    </section>
    <p id="mode-note" class="mode-note" role="status">保留 05 的轮廓，借用 07 的卡面亮度，阴影收得更轻。</p>
  </main>
  <footer>原 05、07 和 Like 选择保留。点击同一会话，可同步比较选中态。</footer>
  <script src="../session-icon-wall/motion.js?v=11-family-1"></script><script src="icon-family.js?v=1"></script><script src="pairing.js?v=1"></script>
</body>
</html>
